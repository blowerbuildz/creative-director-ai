<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Creative Director AI - Send your 10 titles</title>
<style>
:root{--bg:#0a0a0a;--accent:#6366f1;--text:#f5f5f5;--muted:#a3a3a3}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.6}
.wrap{max-width:640px;margin:0 auto;padding:28px 20px 64px}
.brand{font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
h1{font-size:clamp(26px,6vw,36px);margin:16px 0 10px}
.sub{color:var(--muted);margin-bottom:8px}
form{margin-top:16px}
label{display:block;font-size:13px;color:var(--muted);margin:14px 0 4px}
input{width:100%;padding:12px 14px;border-radius:8px;border:1px solid #333;background:#141414;color:var(--text);font-size:16px}
button{margin-top:24px;width:100%;padding:16px;border:none;border-radius:10px;background:var(--accent);color:#fff;font-size:18px;font-weight:700}
.note{color:var(--muted);font-size:13px;margin-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">Creative Director AI</div>
  <h1>You're in. Send us your titles.</h1>
  <p class="sub">We build 3 concepts for each title and email them to you within 24 hours.</p>
  <form action="https://formsubmit.co/dynamiccloser@gmail.com" method="POST">
    <input type="hidden" name="_subject" value="CDAI Thumbnail Pack order">
    <input type="hidden" name="_next" value="https://blowerbuildz.github.io/creative-director-ai/thanks.html">
    <label for="email">Your email (the one you ordered with)</label>
    <input id="email" type="email" name="Email" required>
    <label for="channel">Channel name</label>
    <input id="channel" type="text" name="Channel Name">
    <label for="niche">Niche (what your channel is about)</label>
    <input id="niche" type="text" name="Niche">
    <label for="t1">Video title 1</label>
    <input id="t1" type="text" name="Title 1" required>
    <label for="t2">Video title 2</label>
    <input id="t2" type="text" name="Title 2">
    <label for="t3">Video title 3</label>
    <input id="t3" type="text" name="Title 3">
    <label for="t4">Video title 4</label>
    <input id="t4" type="text" name="Title 4">
    <label for="t5">Video title 5</label>
    <input id="t5" type="text" name="Title 5">
    <label for="t6">Video title 6</label>
    <input id="t6" type="text" name="Title 6">
    <label for="t7">Video title 7</label>
    <input id="t7" type="text" name="Title 7">
    <label for="t8">Video title 8</label>
    <input id="t8" type="text" name="Title 8">
    <label for="t9">Video title 9</label>
    <input id="t9" type="text" name="Title 9">
    <label for="t10">Video title 10</label>
    <input id="t10" type="text" name="Title 10">
    <button type="submit">Send my titles</button>
    <p class="note">Submissions go straight to the Creative Director AI team by email. Trouble with the form? Email your titles to dynamiccloser@gmail.com.</p>
  </form>
</div>
</body>
</html>
